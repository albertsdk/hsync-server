version: 1
disable_existing_loggers: no
formatters:
  default:
    # https://docs.python.org/3/library/logging.html#logging.Formatter
    format: '%(asctime)s.%(msecs)03d - [%(process)d] %(levelname)s: %(message)s'
    datefmt: '%Y-%m-%dT%H:%M:%SZ'
    #use_colors: null

handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout
    
  #file_handler:
  #  class: logging.handlers.RotatingFileHandler
  #  level: DEBUG
  #  formatter: default
  #  filename: log/hsynclog
  #  maxBytes: 10485760 # 10MB
  #  backupCount: 2
  #  encoding: utf8

loggers:
  main:
    level: INFO
    handlers: 
      - console
    propagate": no

  uvicorn.error:
    level: INFO
    handlers: 
      - console
    propagate": no
        
  uvicorn.access:
    level: INFO
    handlers: 
      - console
    propagate": no

