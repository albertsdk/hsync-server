[project]
name = "hsync-server"
version = "1.0.0"
description = "HSYNC File Server"
authors = [{name = "Alberto Basso", email = "17047798+albertobasso@users.noreply.github.com"}]
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiofiles>=25.1.0,<26.0.0",
    "cryptography>=48.0.1,<50.0.0",
    # Capped <0.137: FastAPI 0.137 made `app.routes` a tree with `_IncludedRouter`
    # objects (no `.path`), which prometheus-fastapi-instrumentator 8.0.0 crashes on
    # at every request (AttributeError). Lift to ^0.137 once the instrumentator
    # supports the new routing tree. See trallnag/prometheus-fastapi-instrumentator#370.
    "fastapi>=0.136.0,<0.137.0",
    "hsync-common==1.0.0",
    "loguru>=0.7.3,<0.8.0",
    "prometheus-fastapi-instrumentator>=8.0.0,<9.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "python-multipart>=0.0.32,<0.0.33",
    "slowapi>=0.1.9,<0.2.0",
    "typer>=0.26.0,<0.28.0",
    "uvicorn>=0.49.0,<0.52.0",
    "websockets>=16.0,<17.0",
    "zstandard>=0.25.0,<0.26.0",
]

[project.scripts]
hsync-server = "hsync_server.__main__:run"

[tool.poetry]
packages = [{include = "hsync_server"}]

[tool.poetry.dependencies]
hsync-common = {path = "../hsync-common", develop = true}


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.14.0"
httpx = "^0.28.1"
ruff = "^0.15.0"
mypy = "^2.1.0"
pre-commit = "^4.0.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "B008", "B017", "F401", "SIM101", "SIM103", "SIM105", "SIM118", "F841"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
