[tool.poetry]
name = "hsync-server"
version = "0.1.0"
description = "HSYNC File Server"
authors = ["Alberto Basso <alberto.sdk@gmail.com>"]
readme = "README.md"
packages = [{include = "hsync_server"}]

[tool.poetry.scripts]
hsync-server = "hsync_server.__main__:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.128.0"
uvicorn = "^0.40.0"
prometheus-fastapi-instrumentator = "^7.0.2"
python-multipart = "^0.0.22"
aiohttp = "^3.11.13"
aiofiles = "^25.1.0"
websockets = "^16.0"
watchdog = "^6.0.0"
slowapi = "^0.1.9"
cryptography = "^46.0.0"
python-dotenv = "^1.2.1"
pydantic-settings = "^2.12.0"
loguru = "^0.7.3"
typer = "^0.21.1"
tenacity = "^9.1.3"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
httpx = "^0.28.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
