[tool.poetry]
name = "hsync-server"
version = "1.0.0"
description = "HSYNC File Server"
authors = ["Alberto Basso"]
license = "MPL-2.0"
readme = "README.md"
packages = [{include = "hsync_server"}]

[tool.poetry.scripts]
hsync-server = "hsync_server.__main__:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
hsync-common = {path = "../hsync-common", develop = true}
fastapi = "^0.136.0"
uvicorn = "^0.46.0"
prometheus-fastapi-instrumentator = "^7.0.2"
python-multipart = "^0.0.28"
aiohttp = "^3.11.13"
aiofiles = "^25.1.0"
websockets = "^16.0"
watchdog = "^6.0.0"
slowapi = "^0.1.9"
cryptography = ">=43.0.3,<44.0.0"
python-dotenv = "^1.2.1"
pydantic-settings = "^2.12.0"
loguru = "^0.7.3"
typer = "^0.21.1"
zstandard = "^0.25.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.14.0"
httpx = "^0.28.1"
ruff = "^0.9.0"
mypy = "^1.14.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "B008", "B017", "F401", "SIM101", "SIM103", "SIM105", "SIM118", "F841"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
