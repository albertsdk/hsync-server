[project]
name = "hsync-server"
version = "1.2.0-beta.1"
description = "HSYNC File Server"
authors = [{name = "Alberto Basso", email = "17047798+albertsdk@users.noreply.github.com"}]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiofiles>=25.1.0,<26.0.0",
    "cryptography>=50.0.2,<51.0.0",
    "fastapi>=0.162.2,<0.166.0",
    "hsync-common==1.2.0-beta.1",
    "loguru>=0.7.3,<0.9.0",
    "prometheus-fastapi-instrumentator>=8.1.0,<9.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "python-multipart>=0.0.33,<0.0.35",
    "slowapi>=0.1.10,<0.2.0",
    "typer>=0.29.0,<0.30.0",
    "uvicorn>=0.54.0,<0.55.0",
    "websockets>=16.0,<18.0",
    "zstandard>=0.25.0,<0.26.0",
]

[project.scripts]
hsync-server = "hsync_server.__main__:run"

[tool.poetry]
packages = [{include = "hsync_server"}]

[tool.poetry.dependencies]
hsync-common = {path = "../hsync-common", develop = true}


[tool.poetry.group.build.dependencies]
pyinstaller = "^6.22.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"
pytest-rerunfailures = ">=16.7"
httpx = "^0.28.1"
ruff = "0.17.6"
mypy = "^2.3.1"
pre-commit = "^4.6.2"

# The client is only required by the opt-in black-box test suite
# (test_bb_*, gated behind HSYNC_BB_SERVER=1), which optionally drives the real
# client CLI as an end-to-end peer against a live server subprocess. It is an
# optional sibling repo, mirroring the client's symmetric ``blackbox`` group
# that depends on hsync-server: `poetry install` skips it; install with
# `poetry install --with blackbox`.
[tool.poetry.group.blackbox]
optional = true

[tool.poetry.group.blackbox.dependencies]
hsync-client = {path = "../hsync-client", develop = true}

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "flaky: test with environmental timing sensitivity (retried via pytest-rerunfailures)",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error::DeprecationWarning:hsync_server.*",
    "error::DeprecationWarning:tests.*",
    "default::Warning:hsync_server.*",
    "default::Warning:tests.*",
    "ignore::DeprecationWarning:pathspec.*",
    "ignore::DeprecationWarning:watchdog.*",
    # slowapi 0.1.10 (latest) still calls asyncio.iscoroutinefunction, which is
    # deprecated in Python 3.16. Suppress until slowapi releases a fix; the
    # hsync_server/tests DeprecationWarning->error filters above stay intact.
    "ignore::DeprecationWarning:slowapi.*",
    # Starlette 1.6+ emits a transitional warning on the TestClient import,
    # inviting to migrate to the httpx2 fork. httpx (0.28) still works fully;
    # suppress only this single message so the output stays clean without
    # masking any other deprecations.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    # starlette 1.6 testclient still references the deprecated
    # anyio.abc.BlockingPortal alias (removed no earlier than anyio 5).
    # Third-party (starlette) import-time warning: suppress until fixed there.
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Curated best-practice set shared across the hsync Python projects (see
# hsync-common/pyproject.toml for the rationale).
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B", "A", "C4",
    "ISC", "ICN",
    "PIE", "RET", "RSE",
    "SIM", "TID",
    "ARG", "PERF",
    "FURB", "RUF",
    "PGH", "LOG", "G",
    "PL", "T10", "ERA",
    "C90",
]
ignore = [
    # pre-existing
    "E501", "E402", "B904", "B008", "B017",
    "SIM115", "SIM117", "SIM102", "SIM105", "SIM101", "SIM103", "SIM118",
    # deliberate patterns / opinionated rules
    "ARG002", "EM101", "EM102", "TRY003", "N818",
    "PLC0415", "PLW0603", "PLR2004",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
    "PTH", "DTZ005", "ERA001", "RUF002", "RUF003",
    # server-specific: handler/callback arguments and the logging f-string style
    "ARG001", "A001", "G004",
]

[tool.ruff.lint.per-file-ignores]
# Tests keep fixture parameters, unpacked shapes, loose lambdas and odd strings.
"tests/**" = [
    "ARG004", "ARG005", "RUF059", "RUF012", "RUF007", "RUF015", "RUF005",
    "RUF010", "RUF046", "PLR0402", "PLW0108", "PLW1510", "PLW2901", "PERF102",
    "RET501", "RET504", "PLR1711", "PIE807", "PIE808", "FURB171", "ICN001",
    "RSE102", "PERF401",
]
"bench/**" = ["ARG001", "ARG005", "RUF059", "PIE810", "PLW1510", "PERF401"]

[tool.ruff.lint.mccabe]
# A pragmatic ceiling that the current code meets; lower it as functions are
# refactored.
max-complexity = 15

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
