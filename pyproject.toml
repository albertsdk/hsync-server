[tool.poetry]
name = "hsync-server"
version = "0.1.0"
description = "HSYNC File Server"
authors = ["Alberto Basso <alberto.sdk@gmail.com>"]
readme = "README.md"
packages = [{include = "hsync_server"}]

[tool.poetry.scripts]
hsync-server = "hsync_server.__main__:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.115.8"
uvicorn = "^0.34.0"
prometheus-fastapi-instrumentator = "^7.0.2"
pyyaml = "^6.0.2"
python-multipart = "^0.0.20"
requests = "^2.32.3"
aiohttp = "^3.11.13"
aiofiles = "^24.1.0"
websockets = "^15.0"
watchdog = "^6.0.0"
watchfiles = "^1.0.4"
slowapi = "^0.1.9"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
