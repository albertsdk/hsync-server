[project]
name = "hsync-server"
version = "1.0.4"
description = "HSYNC File Server"
authors = [{name = "Alberto Basso", email = "17047798+albertsdk@users.noreply.github.com"}]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiofiles>=25.1.0,<26.0.0",
    "cryptography>=50.0.2,<51.0.0",
    "fastapi>=0.143.1,<0.144.0",
    "hsync-common==1.0.4",
    "loguru>=0.7.3,<0.8.0",
    "prometheus-fastapi-instrumentator>=8.1.0,<9.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "python-multipart>=0.0.32,<0.0.33",
    "slowapi>=0.1.10,<0.2.0",
    "typer>=0.26.0,<0.28.0",
    "uvicorn>=0.54.0,<0.55.0",
    "websockets>=16.0,<18.0",
    "zstandard>=0.25.0,<0.26.0",
]

[project.scripts]
hsync-server = "hsync_server.__main__:run"

[tool.poetry]
packages = [{include = "hsync_server"}]

[tool.poetry.dependencies]
hsync-common = {path = "../hsync-common", develop = true}


[tool.poetry.group.build.dependencies]
pyinstaller = "^6.22.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"
pytest-rerunfailures = ">=16.7"
httpx = "^0.28.1"
ruff = "0.17.0"
mypy = "^2.3.1"
pre-commit = "^4.6.2"

# The client is only required by the opt-in black-box test suite
# (test_bb_*, gated behind HSYNC_BB_SERVER=1), which optionally drives the real
# client CLI as an end-to-end peer against a live server subprocess. It is an
# optional sibling repo, mirroring the client's symmetric ``blackbox`` group
# that depends on hsync-server: `poetry install` skips it; install with
# `poetry install --with blackbox`.
[tool.poetry.group.blackbox]
optional = true

[tool.poetry.group.blackbox.dependencies]
hsync-client = {path = "../hsync-client", develop = true}

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "flaky: test with environmental timing sensitivity (retried via pytest-rerunfailures)",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error::DeprecationWarning:hsync_server.*",
    "error::DeprecationWarning:tests.*",
    "default::Warning:hsync_server.*",
    "default::Warning:tests.*",
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    "ignore::DeprecationWarning:pathspec.*",
    "ignore::DeprecationWarning:watchdog.*",
    # slowapi 0.1.10 (latest) still calls asyncio.iscoroutinefunction, which is
    # deprecated in Python 3.16. Suppress until slowapi releases a fix; the
    # hsync_server/tests DeprecationWarning->error filters above stay intact.
    "ignore::DeprecationWarning:slowapi.*",
    # Starlette 1.6+ emits a transitional warning on the TestClient import,
    # inviting to migrate to the httpx2 fork. httpx (0.28) still works fully;
    # suppress only this single message so the output stays clean without
    # masking any other deprecations.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    # starlette 1.6 testclient still references the deprecated
    # anyio.abc.BlockingPortal alias (removed no earlier than anyio 5).
    # Third-party (starlette) import-time warning: suppress until fixed there.
    "ignore::DeprecationWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "B008", "B017", "SIM101", "SIM103", "SIM105", "SIM118"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
