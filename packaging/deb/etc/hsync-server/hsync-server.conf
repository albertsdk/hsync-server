# hsync-server configuration (systemd EnvironmentFile).
#
# Every key maps to a HSYNC_* environment variable consumed by hsync-server.
# The file is owned root:root (0600) because HSYNC_ADMIN_KEY is a secret;
# systemd reads it as root and the daemon drops to the _hsync-server user.
#
# REQUIRED before the first start:
#   generate a key with:  openssl rand -hex 32
#   then run:  sudo systemctl enable --now hsync-server.service
HSYNC_ADMIN_KEY=

# Data directories (created by the package, owned by _hsync-server).
HSYNC_BUCKETS=/var/lib/hsync-server/buckets
HSYNC_STATE_DIR=/var/lib/hsync-server/state
HSYNC_SSL_CERT_DIR=/var/lib/hsync-server/certs

# Logging.
HSYNC_LOG_FILE=/var/log/hsync-server/hsync-server.log
#HSYNC_LOG_LEVEL=info

# Bind. Any port is allowed: the packaged unit grants CAP_NET_BIND_SERVICE, so
# 443 works without running the daemon as root.
#HSYNC_PORT=9753

# TLS. HSYNC clients only speak https:// (a plain-http server URL is rejected),
# so either enable TLS here or run behind a proxy that terminates it.
# When enabled with no certificate configured, the server generates a
# self-signed identity in HSYNC_SSL_CERT_DIR and clients pin its fingerprint
# (`hsync-server admin tls fingerprint`).
#HSYNC_SSL_ENABLED=false
#HSYNC_SSL_CERTFILE=
#HSYNC_SSL_KEYFILE=
