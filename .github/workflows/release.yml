name: Release

# Build and push the multi-arch server image to GHCR when a vX.Y.Z tag is
# pushed. The Dockerfile depends on ../hsync-common at build time, so the build
# context is the repository root and hsync-common is checked out alongside.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          }

  image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { path: hsync-server }
      - uses: actions/checkout@v7
        with:
          repository: albertobasso/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hsync-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/albertobasso/hsync-server:${{ github.ref_name }}
            ghcr.io/albertobasso/hsync-server:latest
  assets:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare deployment assets
        run: |
          sed "s/^readonly DEFAULT_VERSION=.*/readonly DEFAULT_VERSION=\"${GITHUB_REF_NAME}\"/" install.sh > install.sh.tmp
          mv install.sh.tmp install.sh
          chmod 755 install.sh
          sha256sum install.sh compose.yaml > SHA256SUMS
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if it doesn't exist; ignore error if it does.
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag || true
          # Upload assets, overwriting any existing ones with the same name.
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            install.sh compose.yaml SHA256SUMS
